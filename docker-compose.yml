services:
  postgres:
    image: postgres:17-trixie
    container_name: basi-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: basi_dev
      POSTGRES_USER: basi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basi_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basi -d basi_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
